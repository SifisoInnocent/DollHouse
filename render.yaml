services:
  - type: web
    name: thutos-dollhouse
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn thutos_dollhouse.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thutos-dollhouse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: thutos-dollhouse.onrender.com
      - key: PYTHON_VERSION
        value: 3.14

databases:
  - name: thutos-dollhouse-db
    databaseName: thutos_dollhouse
    user: thutos_dollhouse_user
